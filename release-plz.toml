# release-plz: the release PR and the publish that follows it.
#
# A release is cut in two steps, neither of them a local command. A dispatch of
# `Release-plz` (.github/workflows/release-plz.yml) opens a release PR at the current
# main: the version bump and the CHANGELOG. Merging that PR publishes the five crates
# in dependency order and pushes the `v<version>` tag, and that tag is what
# `Release` (cargo-dist) builds binaries for.
#
# The next version is read from the commits since the last tag. The workspace is on
# 0.x, where release-plz would bump patch for everything short of a `!` breaking
# marker. Here a minor is the unit that changes what a scaffold or a release pin can
# know, so a PR whose title starts with `feat:` asks for one; anything else is a patch.
# A change to a published crate's public API asks for one too, for the reason cargo
# gives: on 0.x the minor is the compatibility unit, and a patch that moved an API
# breaks the line (CONTRIBUTING § Commits). The commits are read per package, by the
# files they touch: a `feat:` outside every crate directory changes nothing here.
# `features_always_increment_minor` is what makes `feat:` mean minor on 0.x.

[workspace]
semver_check = false
features_always_increment_minor = true
changelog_update = false
dependencies_update = false
# The GitHub Release is created by cargo-dist (release.yml) from the tag, with the
# binaries attached; release-plz only publishes and tags.
git_release_enable = false
git_tag_enable = false
git_tag_name = "v{{ version }}"
# Publish only when the commit that landed on main is the release PR's; an ordinary
# merge never publishes.
release_always = false
pr_labels = ["release"]

# The six crates move in lockstep through `[workspace.package] version`, so one crate
# is enough to tag and to keep the single root CHANGELOG. `htl-cli` is that crate; the
# others fold their commits into its changelog once each is on crates.io
# (`changelog_include` below).
[[package]]
name = "htl-cli"
git_tag_enable = true
changelog_update = true
changelog_path = "./CHANGELOG.md"
# A package goes in here once it is on crates.io, not before: an unpublished package has
# no last release for release-plz to count from, so it reads the whole history
# (max_analyze_commits, 1000), and the fold put 127 entries under 0.8.0 the first time
# htl-mq was listed. The same goes for `publish`: Trusted Publishing is configured on a
# crate that exists, so a new crate's first version is `cargo publish` by hand with
# `publish = false` here until then (htl-mq 0.8.0 went out that way).
changelog_include = ["htl-core", "htl-macros", "htl", "htl-mq"]

# htl-std's first release is published by hand, the way htl-mq 0.8.0 was (#291): the
# Trusted Publishing this workflow uses is configured on a crate that exists and cannot
# create one. The release job publishes the other five; then `cargo publish -p htl-std`
# with a token from the same commit (its `htl` dependency is on crates.io by then); then
# the trusted publisher is added to the new crate, this entry comes out, and `htl-std`
# goes into `changelog_include` above. The version still moves with the workspace.
[[package]]
name = "htl-std"
publish = false

# Changelog grouping. `commit_parsers` replaces release-plz's defaults rather than
# extending them, so adding one rule means restating the seven it ships with (read from
# `release_plz_core/src/changelog.rs`; the docs list six and omit `^removed`). The added
# rule, first so it wins, skips merge commits: a pull request lands as a merge commit
# (CONTRIBUTING), whose subject is `Merge pull request #N …` and says nothing the branch's
# own commits do not, so it has no line here. The same goes for a merge made on the branch
# — `Merge remote-tracking branch 'origin/main' into …`, `Merge branch 'main' into …` —
# which every commit of the pull request carries to main (merge commits, not squash) and
# which 0.14.0 listed under "Other" when the rule matched only the pull request's own. So
# the pattern is git's `Merge ` prefix, not one of its subjects. Either form only ever
# appeared when main had moved in a crate's directory while the branch was open. The next
# version is not read from these rules — it comes from every commit's message — so a
# skipped commit still counts there.
[changelog]
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "added" },
  { message = "^changed", group = "changed" },
  { message = "^deprecated", group = "deprecated" },
  { message = "^removed", group = "removed" },
  { message = "^fix", group = "fixed" },
  { message = "^security", group = "security" },
  { message = "^.*", group = "other" },
]
