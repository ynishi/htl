[package]
name = "htl-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Engine of htl (Holistic Typed Lua): Teal check / gen / lint / fmt / test / bundle on an embedded mlua state. Use the `htl` crate."
readme = "../../README.md"
documentation = "https://docs.rs/htl-core"
keywords = ["lua", "teal", "mlua", "typed", "scripting"]
categories = ["development-tools", "game-development"]
include = ["src/**/*", "lua/**/*", "vendor/**/*"]

[features]
default = ["pkg"]
# `htl_core::pkg::TealResolver` / `Project` for mlua-pkg's Registry (pulls git2 via mlua-pkg's package manager).
# toml_edit comes with it: `Project::patch` writes one key into a manifest a person wrote,
# and the rest of that file — its comments, its order, its spacing — has to survive it.
pkg = ["dep:mlua-pkg", "dep:toml_edit"]
# `htl_core::dts`: `.d.tl` generation from Rust source (`#[host_module]` / `#[derive(TealRecord)]`),
# shared by the proc macros and `htl dts`. `htl_core::cexport` (the C header `#[c_export]`
# writes) rides with it: it is the same file scan, pointed at C instead of Teal.
dts = ["dep:syn"]
# `htl_core::ffi`: the C ABI runtime `#[c_export]` generates against — the handle, the
# error slot, the panic guard. Off by default so that a host with no C caller keeps the
# public surface, and the `extern "C"` symbols, it had before.
ffi = []
# mlua's async support, for `async fn` in a `#[host_module]` impl. Off by default: it
# changes how mlua is built, and a host with no async method needs none of it.
async = ["mlua/async"]

[dependencies]
mlua = { workspace = true }
mlua-pkg = { workspace = true, optional = true }
anyhow = { workspace = true }
walkdir = { workspace = true }
# `[toolchain] htl` in htl.toml — a requirement read and matched by cargo's own rules.
semver = { workspace = true }
syn = { version = "2", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"] }
# The run cache (src/cache.rs): entries are JSON, keyed and invalidated by content hash
# (never mtime). Here rather than in the CLI so the linker and the proc macros can read
# the same store `htl check` / `htl test` write.
serde_json = "1"
blake3 = "1"
toml = "0.8"
toml_edit = { version = "0.22", optional = true }

[dev-dependencies]
criterion = "0.8"

# What a cold check spends its time on, so that a claim about what the incremental
# cache saves rests on a measurement. See `benches/check.rs`.
[[bench]]
name = "check"
harness = false

# What verifying a fix against the file rather than against the store costs. See
# `benches/fix.rs`.
[[bench]]
name = "fix"
harness = false
