[package]
name = "htl-macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Proc macros for htl: include_tl! / include_tl_bytes! (Teal checked at cargo build), TealRecord, host_module. Use via the `htl` crate."
readme = "../../README.md"
documentation = "https://docs.rs/htl-macros"
keywords = ["lua", "teal", "mlua", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
# Runs the Teal checker at expansion time. Generated code targets `::htl::` (the umbrella).
# `std` because the checker here has to see what `require("std.json")` is, and a proc macro
# cannot ask which features the crate it expands in gave `htl` — so the declarations are
# in front of every expansion, as `htl.test`'s are, and a host that left the feature off
# finds out at the first `require`, at run time, as it would for `htl.test`.
# `async` for the declaration of `htl.task`: `include_tl!` checks a file that spawns tasks
# against it, the way `htl check` does. The macro runs no program, so the executor the
# feature also compiles is unused here; what the host's own state can load is its `async`.
htl-core = { workspace = true, features = ["pkg", "dts", "std", "async"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
