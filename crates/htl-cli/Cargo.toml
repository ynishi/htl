[package]
name = "htl-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "htl command line (also `cargo htl`): check / run / test / fmt / build / pkg / new for Teal projects"
readme = "../../README.md"
documentation = "https://docs.rs/htl-cli"
keywords = ["lua", "teal", "cli", "cargo-subcommand"]
categories = ["development-tools", "command-line-utilities"]

# Two bins share src/lib.rs: `htl` and `cargo-htl` (so `cargo htl <verb>` works).
# See src/bin/.

[dependencies]
# The CLI needs the engine only, not the proc macros. `std` is what makes `require("std.json")`
# answer under `htl run` / `test` / `check`: a project with no Rust host of its own has no other
# way to a native module than the binary that runs it.
htl = { workspace = true, features = ["pkg", "dts", "std"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.8"

# What the run cache saves, through the binary a user actually runs. The per-phase costs
# it is saving are in `htl-core`'s `check` bench.
[[bench]]
name = "cached_check"
harness = false
