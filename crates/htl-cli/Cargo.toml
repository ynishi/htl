[package]
name = "htl-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "htl command line (also `cargo htl`): check / run / test / fmt / build / pkg / new for Teal projects"
readme = "../../README.md"
documentation = "https://docs.rs/htl-cli"
keywords = ["lua", "teal", "cli", "cargo-subcommand"]
categories = ["development-tools", "command-line-utilities"]

# Two bins share src/lib.rs: `htl` and `cargo-htl` (so `cargo htl <verb>` works).
# See src/bin/.

[dependencies]
# The CLI needs the engine only, not the proc macros. `std` is what makes `require("std.json")`
# answer under `htl run` / `test` / `check`: a project with no Rust host of its own has no other
# way to a native module than the binary that runs it.
# `async` is what lets `htl run` and `htl test` run a program that calls a host's
# `async fn`: the entry chunk runs as a root on mlua-isle's executor (`Htl::run_async`),
# whether or not the program awaits anything.
htl = { workspace = true, features = ["pkg", "dts", "std", "async"] }
# The executor `htl run` drives (`Htl::run_async` on a current-thread runtime and a
# `LocalSet`), and the Ctrl-C that cancels its root.
tokio = { version = "1", features = ["rt", "time", "signal"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reading the `htl` a project's `Cargo.toml` asks for, and comparing it with this binary's
# version by cargo's own rule (`warn_cargo_htl_mismatch`). Both are already in the graph
# under htl-core, which reads `htl.toml` and `[toolchain] htl` with the same two.
toml = "0.8"
semver = { workspace = true }

[dev-dependencies]
criterion = "0.8"

# What the run cache saves, through the binary a user actually runs. The per-phase costs
# it is saving are in `htl-core`'s `check` bench.
[[bench]]
name = "cached_check"
harness = false
