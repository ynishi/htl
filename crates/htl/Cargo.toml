[package]
name = "htl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Holistic Typed Lua: type-check, generate, lint, format and run Teal on an embedded mlua state"
readme = "../../README.md"
keywords = ["lua", "teal", "mlua", "typed", "scripting"]
categories = ["development-tools", "game-development"]
include = ["src/**/*", "lua/**/*", "vendor/**/*"]

[features]
default = ["pkg"]
# `htl::pkg::TealResolver` / `Project` for mlua-pkg's Registry (pulls git2 via mlua-pkg's package manager).
pkg = ["dep:mlua-pkg"]

[dependencies]
mlua = { workspace = true }
mlua-pkg = { workspace = true, optional = true }
anyhow = { workspace = true }
walkdir = { workspace = true }
