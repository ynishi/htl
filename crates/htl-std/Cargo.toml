[package]
name = "htl-std"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "htl's own asynchronous I/O for Teal: `require(\"std.fs\")`, a `#[host_module]` beside mlua-batteries' synchronous `std.*`"
readme = "../../README.md"
documentation = "https://docs.rs/htl-std"
keywords = ["lua", "teal", "async", "filesystem", "io"]
categories = ["filesystem", "asynchronous", "development-tools"]

# The declaration `#[host_module(name = "std.fs", dts = "dts/std/fs.d.tl")]` writes at
# expansion, shipped in the tarball and materialised by a depending project's `htl dts`.
# `std.fs` is dotted, so `dts_root` says where the namespace starts (`htl-core/src/dep_dts.rs`
# "A crate whose modules have a namespace says where its paths start"): without it only the
# file's own name survives into `types/<crate>/`, landing at `types/htl-std/fs.d.tl` — a
# declaration of `fs`, not `std.fs`. With it, what is below `dts_root` is kept, landing at
# `types/htl-std/std/fs.d.tl`, which `require("std.fs")` resolves.
[package.metadata.htl]
dts_root = "dts"
dts = ["dts/std/fs.d.tl"]

[dependencies]
htl = { workspace = true, features = ["macros", "async"] }
# `fs` for the async file operations; `rt` because every one of them is a `spawn_blocking`
# under tokio's own `fs` module, which needs the blocking pool the runtime provides.
tokio = { version = "1", features = ["fs", "rt"] }
# `walk` is the one function with no `tokio::fs` primitive to be: it is one
# `spawn_blocking` around a synchronous directory-tree walk, and the workspace already
# depends on this crate for that (`htl-core`'s own project walks).
walkdir = { workspace = true }
anyhow = { workspace = true }
