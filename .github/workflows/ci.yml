name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: test + clippy (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable, and the workspace's rust-version (MSRV) so a newer-syntax slip is caught.
        toolchain: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # mlua builds its vendored Lua 5.4; no system Lua or Teal needed.
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # Every end-to-end case in one step because they are one recipe: the CLI on the
      # repository's own .tl, the embed example through both macro paths, the run cache
      # cold and then warm, and `htl new` for each `--host` built, tested and run — the C
      # ABI project's library loaded by the reference callers it ships, with cc, make and
      # python3 all present on this runner (the recipe says so and skips either caller
      # where they are not). The cheap cases come first inside it, so a break in one of
      # them still fails within a minute of the job starting.
      - run: just e2e
      # The release gate, run on every commit rather than only at a release. It needs two
      # things this job already has: a clean worktree, because `cargo package` is told by
      # git which files reach the tarball and refuses to guess, and the compiled graph the
      # step above leaves in the same target directory. What it catches — a file an
      # `include` glob drops, an `include_str!` target that is ignored — is introduced by a
      # commit, so this is the commit that should go red for it, not the release weeks
      # later that inherits it.
      - run: just e2e-scaffold-packaged
