[package]
name = "embed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Example host: Rust binary embedding Teal scripts via include_tl!"

[features]
# `cargo build -p embed --features bad` demonstrates a Teal type error failing the Rust build.
bad = []

[dependencies]
# `async` for `http`, the `#[host_module]` with an `async fn` that `--async` awaits from
# Teal: the executor (`Htl::run_blocking`) and `htl.task` come with it.
htl = { workspace = true, features = ["macros", "pkg", "async"] }
anyhow = { workspace = true }
# `http.get` sleeps on tokio's timer; the runtime itself is the one `Htl::run_blocking` builds.
tokio = { version = "1", features = ["time"] }
