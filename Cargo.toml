[workspace]
resolver = "3"
members = [
    "crates/htl",
    "crates/htl-macros",
    "crates/htl-cli",
    "examples/embed",
    "examples/resolver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Yutaka Nishimura"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ynishi/htl"
rust-version = "1.88"

[workspace.dependencies]
htl = { path = "crates/htl", version = "0.1.0" }
htl-macros = { path = "crates/htl-macros", version = "0.1.0" }
mlua = { version = "0.12.1", features = ["lua54", "vendored", "error-send"] }
mlua-pkg = "0.9.0"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
walkdir = "2.5.0"
