[workspace]
resolver = "3"
members = [
    "crates/htl-core",
    "crates/htl-macros",
    "crates/htl",
    "crates/htl-cli",
    "examples/embed",
    "examples/resolver",
    "e2e",
]
# Everything above except `e2e`, which is a member so that `--workspace` compiles and lints
# it and it cannot rot, and not a default member so that `cargo test` does not run it. Its
# three tests scaffold a Cargo project each and build it from nothing, which is minutes —
# the wrong price for the command run before every commit, and the right one for `just e2e`,
# which asks for it by name.
#
# The cost of this line is that `cargo test` and `cargo test --workspace` now differ by
# minutes and nothing in either one's output says so.
default-members = [
    "crates/htl-core",
    "crates/htl-macros",
    "crates/htl",
    "crates/htl-cli",
    "examples/embed",
    "examples/resolver",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Yutaka Nishimura"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ynishi/htl"
# The project's page is its repository. `documentation` is per crate (docs.rs is keyed on
# the crate name), so it is set in each of the four rather than inherited from here.
homepage = "https://github.com/ynishi/htl"
rust-version = "1.88"

[workspace.dependencies]
# default-features off at the workspace level so members opt in (`features = [...]`).
htl-core = { path = "crates/htl-core", version = "0.4.0", default-features = false }
htl-macros = { path = "crates/htl-macros", version = "0.4.0" }
htl = { path = "crates/htl", version = "0.4.0", default-features = false }
mlua = { version = "0.12.1", features = ["lua54", "vendored", "error-send"] }
mlua-pkg = "0.11.0"
anyhow = "1.0.104"
# `[toolchain] htl` in htl.toml: cargo's own requirement syntax and matching rule, so a
# pin on the command reads and behaves as the `htl = "0.4"` beside it in Cargo.toml.
# Already in the graph (mlua-pkg resolves versions with it) and it has no dependencies.
semver = "1.0.28"
clap = { version = "4.6.6", features = ["derive"] }
walkdir = "2.5.0"
