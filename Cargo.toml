[workspace]
resolver = "3"
members = [
    "crates/htl-core",
    "crates/htl-macros",
    "crates/htl",
    "crates/htl-cli",
    "examples/embed",
    "examples/resolver",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Yutaka Nishimura"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ynishi/htl"
# The project's page is its repository. `documentation` is per crate (docs.rs is keyed on
# the crate name), so it is set in each of the four rather than inherited from here.
homepage = "https://github.com/ynishi/htl"
rust-version = "1.88"

[workspace.dependencies]
# default-features off at the workspace level so members opt in (`features = [...]`).
htl-core = { path = "crates/htl-core", version = "0.3.0", default-features = false }
htl-macros = { path = "crates/htl-macros", version = "0.3.0" }
htl = { path = "crates/htl", version = "0.3.0", default-features = false }
mlua = { version = "0.12.1", features = ["lua54", "vendored", "error-send"] }
mlua-pkg = "0.11.0"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
walkdir = "2.5.0"

# The Teal checker runs inside htl's proc macros (`include_tl!` / `include_bundle!`), and
# the dev profile compiles a proc macro and its dependencies — htl-core, mlua, the vendored
# Lua — under `build-override`, whose default is `opt-level = 0`. Left there, every
# `cargo build -p embed` that touches a `.tl` runs the checker about 3x slower than the
# release CLI does (README "Embedding in Rust"). `htl new --embed` writes the same section.
[profile.dev.build-override]
opt-level = 3
